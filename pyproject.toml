[project]
name = "python-snaptime"
dynamic = ["version"]
description = "Easily manipulate datetime objects with relative time modifiers. Snap, shift, and chain operations on timezone-aware datetimes. E.g `@d-2h`"
authors = [{ name = "Daniel Tomlinson", email = "dtomlinson@panaetius.co.uk" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "ISC"
keywords = [
    "datetime",
    "time",
    "datetime",
    "timesnap",
    "timesnapper",
    "snaptime ",
]
dependencies = [
    "pendulum>=2,<4",
    "pydantic>=2.13.5,<3",
]

[project.urls]
Homepage = "https://github.com/dtomlinson91/python-snaptime"
Repository = "https://github.com/dtomlinson91/python-snaptime"
Documentation = "https://github.com/dtomlinson91/python-snaptime"

[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18",
    "pycln>=2.6.0,<3",
    "isort>=9.0.2,<10",
    "pytest>=9.2.0,<10",
    "coverage>=7.10.7,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-cov>=7.1.0,<8",
    "black>=26.10.1",
    "pyright>=1.1.414",
]

[tool.uv]
default-groups = "all"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
indent-width = 4
# include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py"]
# required-version = ">=X.Y.Z"
# unsafe-fixes = true
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ruff formatter
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # docstring-tab-indentation
    "D300",   # triple-single-quotes
    "Q",      # flake8-quotes (Q000-Q004)
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma

    "ANN401",  # any-type
    "CPY",     # flake8-copyright
    "DTZ006",  # call-datetime-fromtimestamp
    "C901",    # complex-structure
    # "PLR0913", # too-many-arguments
    # "FA",      # flake8-future-annotations
    # "T201",    # print
    # "TRY003",  # Avoid specifying long messages outside the exception class
    # "EM101",   # Exception must not use a string literal, assign to variable first
    # "S113",    # request-without-timeout
    # "S608",    # hardcoded-sql-expression
    # "RET503",  # implicit-return
]
exclude = ["scripts/test.py"]  # lint only, ruff format still formats these files

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["python_snaptime"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert
    "PLR2004", # magic-value-comparison
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "python_snaptime/__version__.py"
template = '''"""The package version."""

__version__ = "{version}"
'''

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["typings/**", "tests/**"]
pythonVersion = "3.10" # set to minimum version of Python supported by the project

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
omit = ["__version__.py"]
