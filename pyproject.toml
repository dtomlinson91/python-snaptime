[tool.poetry]
name = "python-snaptime"
version = "0.0.0"
description = "Easily manipulate datetime objects with relative time modifiers. Snap, shift, and chain operations on timezone-aware datetimes. E.g `@d-2h`"
authors = ["Daniel Tomlinson <dtomlinson@panaetius.co.uk>"]
readme = "README.md"
license = "ISC"
homepage = "https://github.com/dtomlinson91/python-snaptime"
repository = "https://github.com/dtomlinson91/python-snaptime"
documentation = "https://github.com/dtomlinson91/python-snaptime"
keywords = [
    "datetime",
    "time",
    "datetime",
    "timesnap",
    "timesnapper",
    "snaptime ",
]

[tool.poetry.dependencies]
python = "^3.10"
pendulum = ">=2,<4"
pydantic = "^2.13.5"
eval-type-backport = "^0.4.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.3"
pycln = "^2.6.0"
isort = "^9.0.2"
pytest = "^9.2.0"
coverage = "^7.10.7"
pytest-mock = "^3.15.1"
pytest-cov = "^7.1.0"


[build-system]
requires = ["poetry-core", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
# include = ["pyproject.toml", "src/**/*.py", "scripts/**/*.py"]
# required-version = ">=X.Y.Z"
# unsafe-fixes = true
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ruff formatter
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # docstring-tab-indentation
    "D300",   # triple-single-quotes
    "Q",      # flake8-quotes (Q000-Q004)
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma

    "ANN401",  # any-type
    "CPY",     # flake8-copyright
    "DTZ006",  # call-datetime-fromtimestamp
    # "PLR0913", # too-many-arguments
    # "FA",      # flake8-future-annotations
    # "T201",    # print
    # "TRY003",  # Avoid specifying long messages outside the exception class
    # "EM101",   # Exception must not use a string literal, assign to variable first
    # "S113",    # request-without-timeout
    # "S608",    # hardcoded-sql-expression
    # "RET503",  # implicit-return
]
exclude = ["tests"]  # lint only, ruff format still formats these files

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["python_snaptime"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert
    "PLR2004", # magic-value-comparison
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry-dynamic-versioning.substitution]
files = ["python_snaptime/__version__.py"]

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["typings/**", "tests/**"]

[tool.pytest]
mock_use_standalone_module = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
omit = ["__version__.py"]
